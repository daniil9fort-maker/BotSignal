name: TikTok Bot 24/7 Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write   # чтобы бот мог пушить скрины в репозиторий

# Не даём запуститься двум копиям бота одновременно
# (иначе Telegram выдаст ошибку 409: два бота с одним токеном)
concurrency:
  group: tiktok-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 185

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Восстанавливаем аккаунты/сессии из прошлого запуска.
      # (download-artifact тут не работает: он берёт файлы только из ТЕКУЩЕГО запуска)
      - name: Restore user sessions and tasks
        uses: actions/cache/restore@v4
        with:
          path: users
          key: users-${{ github.run_id }}
          restore-keys: |
            users-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Xvfb, VNC, noVNC, Cloudflared)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify wget
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Install Python dependencies & Playwright Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Xvfb / x11vnc / websockify бот поднимает сам (ensure_vnc_services)
      - name: Run Telegram Bot (about 2h 50m)
        env:
          DISPLAY: ":99"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SADCAPTCHA_API_KEY: ${{ secrets.SADCAPTCHA_API_KEY }}
        run: |
          timeout 10200 python bot.py || true

      - name: Save user sessions and tasks
        if: always()
        uses: actions/cache/save@v4
        with:
          path: users
          key: users-${{ github.run_id }}

      # Скрины можно скачать на странице запуска (Actions -> запуск -> Artifacts)
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: users/*/screenshots
          if-no-files-found: ignore
          retention-days: 3
